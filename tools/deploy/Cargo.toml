[package]
name = "ados-deploy"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Rust TUI that self-hosts the full Altnautica ADOS stack (Mission Control + Convex + MQTT + video relay) in one guided flow."

[[bin]]
name = "ados-deploy"
path = "src/main.rs"

[lib]
name = "ados_deploy"
path = "src/lib.rs"

[dependencies]
# Shared terminal toolkit: theme, frame compositor, the stdio (crossterm)
# terminal backend, live progress renderers, widgets and the command runner.
ados-term = { git = "https://github.com/altnautica/ADOSDroneAgent", rev = "c9f521b13a08a3d24ecf38a3121242fcc138e2df" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ISO-8601 UTC timestamps + the M:SS deploy clock.
time = { version = "0.3", features = ["std", "formatting", "macros"] }
# Secret minting (Convex instance secret, MQTT password) without a full RNG dep.
getrandom = "0.2"
# Step-engine diagnostics.
tracing = "0.1"
# Localhost health polling (http-only; no TLS needed for :3210/:4000/:3001).
ureq = { version = "2", default-features = false }

# SIGINT/SIGQUIT ignore-in-parent for the Pattern-A shell-out (a foreground
# child — `npm run dev`, `docker compose logs -f` — owns Ctrl-C, not the menu).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
