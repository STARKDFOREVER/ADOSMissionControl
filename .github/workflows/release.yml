name: Release

# One-click release from main. `prepare` turns CHANGELOG.md's [Unreleased]
# section into the requested version, bumps package.json and package-lock.json,
# commits, tags and pushes; `build` then runs Desktop Release for that tag.
# The tag push is made with GITHUB_TOKEN, which does not start the
# tag-triggered Desktop Release, so `build` calls it directly. A manual
# `git push origin vX.Y.Z` still releases through that tag trigger.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z). The CHANGELOG [Unreleased] section becomes this version."
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Dispatched from main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "FAIL: run Release from main, not $GITHUB_REF" >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Tests and Guards passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in test.yml guards.yml; do
            c=$(gh run list --workflow "$wf" --commit "$GITHUB_SHA" --json conclusion --jq '.[0].conclusion // ""')
            [ "$c" = success ] || { echo "FAIL: $wf on $GITHUB_SHA is '${c:-not run}'" >&2; exit 1; }
          done

      - name: Promote the changelog and bump the version
        run: node scripts/release-prepare.mjs "$VERSION"

      # --atomic: if main moved since dispatch, both refs are rejected and
      # nothing is published.
      - name: Commit, tag and push
        id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "chore(release): $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
